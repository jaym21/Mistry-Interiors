<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — Mistry Interiors</title>
    <meta name="description" content="Project showcase by Mistry Interiors — Precision Interior Contracting since 1985.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/project.css">
</head>
<body>

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar navbar--project" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo" id="nav-logo">
                <svg class="nav-logo-mark" viewBox="0 0 129 110" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="5" height="110" transform="matrix(-1 0 0 1 128.864 0)" fill="currentColor"/>
                    <rect width="5" height="100" transform="matrix(-1 0 0 1 67 5)" fill="currentColor"/>
                    <rect x="-0.695826" y="-0.125802" width="4" height="56.269" transform="matrix(-0.570024 -0.821628 -0.821628 0.570024 125.708 3.48234)" fill="currentColor"/>
                    <path d="M0 2.38419e-07H5V110H0V2.38419e-07Z" fill="currentColor"/>
                    <path d="M1.95984 4.10814L4.80996 0L51.8638 32.6447L49.0137 36.7529L1.95984 4.10814Z" fill="currentColor"/>
                    <rect x="47" width="35" height="5" fill="currentColor"/>
                    <rect x="47" y="105" width="35" height="5" fill="currentColor"/>
                </svg>
                <span class="nav-logo-text">MISTRY INTERIORS</span>
            </a>
            <a href="index.html#portfolio" class="project-back-link">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
                    <line x1="16" y1="10" x2="4" y2="10"/>
                    <polyline points="9,5 4,10 9,15"/>
                </svg>
                <span>Back to Portfolio</span>
            </a>
        </div>
    </nav>

    <!-- ========== PROJECT HEADER ========== -->
    <section class="project-header">
        <div class="container">
            <div class="project-header-content">
                <span class="project-category" id="project-category">Corporate Office</span>
                <h1 class="project-title" id="project-title">Project Title</h1>
                <div class="project-meta-row">
                    <div class="project-meta-item">
                        <span class="project-meta-label">Location</span>
                        <span class="project-meta-value" id="project-location">Mumbai</span>
                    </div>
                    <div class="project-meta-divider"></div>
                    <div class="project-meta-item">
                        <span class="project-meta-label">Area</span>
                        <span class="project-meta-value" id="project-area">8,000 sq ft</span>
                    </div>
                    <div class="project-meta-divider"></div>
                    <div class="project-meta-item">
                        <span class="project-meta-label">Type</span>
                        <span class="project-meta-value" id="project-type">Turnkey Fit-Out</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ========== PROJECT GALLERY — Masonry Grid ========== -->
    <section class="project-gallery">
        <div class="container">
            <div class="masonry-grid" id="masonry-grid">
                <!-- Images injected by JS -->
            </div>
        </div>
    </section>

    <!-- ========== LIGHTBOX ========== -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="6" y1="6" x2="22" y2="22"/>
                <line x1="22" y1="6" x2="6" y2="22"/>
            </svg>
        </button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15,4 7,12 15,20"/>
            </svg>
        </button>
        <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9,4 17,12 9,20"/>
            </svg>
        </button>
        <div class="lightbox-img-wrapper">
            <img src="" alt="" class="lightbox-img" id="lightbox-img">
        </div>
        <div class="lightbox-counter" id="lightbox-counter">1 / 5</div>
    </div>

    <!-- ========== FOOTER (minimal) ========== -->
    <footer class="footer project-footer">
        <div class="container">
            <div class="footer-bottom">
                <p class="footer-copyright">© 2025 Mistry Interiors LLP. All rights reserved.</p>
                <p class="footer-credit">Precision Interior Contracting</p>
            </div>
        </div>
    </footer>

    <script src="js/project.js"></script>
</body>
</html>
